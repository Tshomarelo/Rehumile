<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="shortcut icon" href="/portal/static/img/icons/icon-48x48.png"/>
  <title>Notifications | Rehumile IMS</title>
  <link href="/portal/static/css/app.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
<div class="wrapper">
  <nav id="sidebar" class="sidebar js-sidebar">
    <div class="sidebar-content js-simplebar">
      <a class="sidebar-brand d-flex align-items-center p-2" href="/portal/dashboard/">
        <img src="/portal/static/img/rehumile-logo.jpeg" style="height:36px;object-fit:contain" alt="Rehumile TMW">
      </a>
      <ul class="sidebar-nav"></ul>
    </div>
  </nav>
  <div class="main">
    <nav class="navbar navbar-expand navbar-light navbar-bg">
      <a class="sidebar-toggle js-sidebar-toggle"><i class="hamburger align-self-center"></i></a>
      <div class="navbar-collapse collapse">
        <ul class="navbar-nav navbar-align">
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle d-none d-sm-inline-block" href="#" data-bs-toggle="dropdown">
              <i class="align-middle me-1" data-feather="user"></i><span class="text-dark" id="navUserName">…</span>
            </a>
            <div class="dropdown-menu dropdown-menu-end">
              <span class="dropdown-item-text small text-muted" id="navUserRole"></span>
              <div class="dropdown-divider"></div>
              <a class="dropdown-item" href="#" id="logoutBtn"><i class="align-middle me-1" data-feather="log-out"></i> Sign out</a>
            </div>
          </li>
        </ul>
      </div>
    </nav>
    <main class="content">
      <div class="container-fluid p-0">
        <div class="d-flex align-items-center justify-content-between mb-3">
          <h1 class="h3 mb-0"><strong>Notifications</strong></h1>
          <button class="btn btn-sm btn-outline-secondary" id="markAllBtn">Mark all as read</button>
        </div>

        <div class="row g-2 mb-3">
          <div class="col-md-3">
            <select class="form-select form-select-sm" id="fType">
              <option value="">All Types</option>
              <option value="sla_breach">SLA Breach</option>
              <option value="sla_warning">SLA Warning</option>
              <option value="new_incident">New Ticket</option>
              <option value="assignment">Assignment</option>
              <option value="invoice">Invoice</option>
              <option value="general">General</option>
            </select>
          </div>
          <div class="col-md-3 d-flex align-items-center">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="fUnread">
              <label class="form-check-label" for="fUnread">Unread only</label>
            </div>
          </div>
          <div class="col-md-2">
            <button class="btn btn-sm btn-outline-secondary w-100" id="fClear">Clear</button>
          </div>
        </div>

        <div class="card">
          <div class="card-body p-0">
            <div id="notifList">
              <div class="text-center text-muted py-5">Loading…</div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <footer class="footer"><div class="container-fluid"><p class="mb-0 text-muted">Rehumile TMW IMS &copy; 2025</p></div></footer>
  </div>
</div>
<script src="/portal/static/js/app.js"></script>
<script src="/portal/static/js/hq-sidebar-menu.js?v=20261001"></script>
<script src="/portal/static/js/hq-filters.js"></script>
<script>
(function(){
  const token = localStorage.getItem('ims_access');
  if(!token){ window.location.href='/portal/login/'; return; }
  const user = JSON.parse(localStorage.getItem('ims_user')||'{}');
  document.getElementById('navUserName').textContent = ((user.first_name||'')+' '+(user.last_name||'')).trim()||user.email||'HQ';
  document.getElementById('navUserRole').textContent = user.role||'';
  document.getElementById('logoutBtn').onclick=e=>{e.preventDefault();localStorage.clear();window.location.href='/portal/login/';};

  const typeIcon = {
    sla_breach: '<span class="badge bg-danger me-2">SLA Breach</span>',
    sla_warning: '<span class="badge bg-warning text-dark me-2">SLA Warning</span>',
    new_incident: '<span class="badge bg-primary me-2">New Ticket</span>',
    assignment: '<span class="badge bg-info text-dark me-2">Assignment</span>',
    invoice: '<span class="badge bg-success me-2">Invoice</span>',
    general: '<span class="badge bg-secondary me-2">Info</span>',
  };
  const fmtDate = d => d ? new Date(d).toLocaleString('en-ZA',{dateStyle:'medium',timeStyle:'short'}) : '—';

  function currentFilters(){
    return {
      type: document.getElementById('fType').value,
      unread: document.getElementById('fUnread').checked ? '1' : '',
    };
  }

  async function load(){
    const params = HQFilters.qs(currentFilters());
    const r = await fetch('/portal/api/notifications/'+(params?'?'+params:''),{headers:{'Authorization':'Bearer '+token}});
    if(r.status===401){localStorage.clear();window.location.href='/portal/login/';return;}
    const data = await r.json();
    const list = document.getElementById('notifList');
    if(!data.notifications.length){
      list.innerHTML='<div class="text-center text-muted py-5"><i data-feather="bell-off" style="width:40px;height:40px;opacity:.3"></i><p class="mt-2">No notifications</p></div>';
      feather.replace();return;
    }
    list.innerHTML = data.notifications.map(n=>`
      <div class="d-flex align-items-start p-3 border-bottom ${n.is_read?'':'bg-light'}" data-id="${n.id}">
        <div class="flex-grow-1">
          <div class="d-flex align-items-center mb-1">
            ${typeIcon[n.type]||typeIcon.general}
            <strong class="me-2">${n.title}</strong>
            <small class="text-muted ms-auto">${fmtDate(n.created_at)}</small>
          </div>
          <p class="mb-1 text-muted small">${n.message}</p>
          ${n.ticket_id?`<a href="/portal/incidents/" class="small text-primary">View ticket ${n.ticket_id}</a>`:''}
        </div>
        ${!n.is_read?`<button class="btn btn-sm btn-outline-secondary ms-3 mark-read-btn" data-id="${n.id}">Mark read</button>`:''}
      </div>`).join('');

    document.querySelectorAll('.mark-read-btn').forEach(btn=>{
      btn.onclick=async()=>{
        await fetch('/portal/api/notifications/',{method:'PATCH',headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({ids:[btn.dataset.id]})});
        load();
      };
    });
    feather.replace();
  }

  document.getElementById('markAllBtn').onclick=async()=>{
    await fetch('/portal/api/notifications/',{method:'PATCH',headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({all:true})});
    load();
  };

  document.getElementById('fType').addEventListener('change', load);
  document.getElementById('fUnread').addEventListener('change', load);
  document.getElementById('fClear').addEventListener('click', ()=>{
    document.getElementById('fType').value='';
    document.getElementById('fUnread').checked=false;
    load();
  });

  load();
})();
</script>
</body>
</html>
