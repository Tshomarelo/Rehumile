<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="shortcut icon" href="/portal/static/img/icons/icon-48x48.png"/>
  <title>Audit Log | Rehumile IMS</title>
  <link href="/portal/static/css/app.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
<div class="wrapper">
  <nav id="sidebar" class="sidebar js-sidebar">
    <div class="sidebar-content js-simplebar">
      <a class="sidebar-brand d-flex align-items-center p-2" href="/portal/dashboard/">
        <img src="/portal/static/img/rehumile-logo.jpeg" style="height:36px;object-fit:contain" alt="Rehumile TMW">
      </a>
      <ul class="sidebar-nav"></ul>
    </div>
  </nav>
  <div class="main">
    <nav class="navbar navbar-expand navbar-light navbar-bg">
      <a class="sidebar-toggle js-sidebar-toggle"><i class="hamburger align-self-center"></i></a>
      <div class="navbar-collapse collapse">
        <ul class="navbar-nav navbar-align">
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle d-none d-sm-inline-block" href="#" data-bs-toggle="dropdown">
              <i class="align-middle me-1" data-feather="user"></i><span class="text-dark" id="navUserName">…</span>
            </a>
            <div class="dropdown-menu dropdown-menu-end">
              <span class="dropdown-item-text small text-muted" id="navUserRole"></span>
              <div class="dropdown-divider"></div>
              <a class="dropdown-item" href="#" id="logoutBtn"><i class="align-middle me-1" data-feather="log-out"></i> Sign out</a>
            </div>
          </li>
        </ul>
      </div>
    </nav>
    <main class="content">
      <div class="container-fluid p-0">
        <div class="d-flex align-items-center justify-content-between mb-3">
          <h1 class="h3 mb-0"><strong>Audit Log</strong></h1>
          <button class="btn btn-sm btn-outline-secondary" id="refreshBtn"><i data-feather="refresh-cw" style="width:14px;height:14px"></i></button>
        </div>

        <div class="row g-2 mb-3">
          <div class="col-md-3">
            <input type="text" id="searchInput" class="form-control form-control-sm" placeholder="Search user, action, model, object ID…">
          </div>
          <div class="col-md-2">
            <select class="form-select form-select-sm" id="fAction">
              <option value="">All Actions</option>
            </select>
          </div>
          <div class="col-md-2">
            <select class="form-select form-select-sm" id="fModel">
              <option value="">All Models</option>
            </select>
          </div>
          <div class="col-md-2">
            <input type="date" class="form-control form-control-sm" id="fDateFrom" title="From date">
          </div>
          <div class="col-md-2">
            <input type="date" class="form-control form-control-sm" id="fDateTo" title="To date">
          </div>
          <div class="col-md-1">
            <button class="btn btn-sm btn-outline-secondary w-100" id="fClear">Clear</button>
          </div>
        </div>

        <div class="card">
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-hover table-sm my-0">
                <thead>
                  <tr>
                    <th>Timestamp</th>
                    <th>User</th>
                    <th>Action</th>
                    <th>Model</th>
                    <th>Object ID</th>
                    <th>IP Address</th>
                  </tr>
                </thead>
                <tbody id="logBody"><tr><td colspan="6" class="text-center text-muted py-4">Loading…</td></tr></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </main>
    <footer class="footer"><div class="container-fluid"><p class="mb-0 text-muted">Rehumile TMW IMS &copy; 2025</p></div></footer>
  </div>
</div>
<script src="/portal/static/js/app.js"></script>
<script src="/portal/static/js/hq-sidebar-menu.js?v=20261001"></script>
<script src="/portal/static/js/hq-filters.js"></script>
<script>
(function(){
  const token = localStorage.getItem('ims_access');
  if(!token){ window.location.href='/portal/login/'; return; }
  const user = JSON.parse(localStorage.getItem('ims_user')||'{}');
  document.getElementById('navUserName').textContent = ((user.first_name||'')+' '+(user.last_name||'')).trim()||user.email||'HQ';
  document.getElementById('navUserRole').textContent = user.role||'';
  document.getElementById('logoutBtn').onclick=e=>{e.preventDefault();localStorage.clear();window.location.href='/portal/login/';};

  const fmtDate = d => d ? new Date(d).toLocaleString('en-ZA',{dateStyle:'medium',timeStyle:'short'}) : '—';
  const actionBadge = a => {
    const map = {create:'success',update:'primary',delete:'danger',login:'info',logout:'secondary'};
    const color = Object.entries(map).find(([k])=>a.toLowerCase().includes(k))?.[1]||'secondary';
    return `<span class="badge bg-${color}">${a}</span>`;
  };

  let allLogs = [];

  function currentFilters(){
    return {
      search: document.getElementById('searchInput').value.trim(),
      action: document.getElementById('fAction').value,
      model_name: document.getElementById('fModel').value,
      date_from: document.getElementById('fDateFrom').value,
      date_to: document.getElementById('fDateTo').value,
    };
  }

  async function loadFilterOptions(){
    try{
      const r = await fetch('/portal/api/audit-log/',{headers:{'Authorization':'Bearer '+token}});
      if(!r.ok) return;
      const data = await r.json();
      const logs = data.logs||[];
      const actions = [...new Set(logs.map(l=>l.action).filter(Boolean))].sort();
      const models = [...new Set(logs.map(l=>l.model_name).filter(Boolean))].sort();
      document.getElementById('fAction').innerHTML = '<option value="">All Actions</option>'+actions.map(a=>`<option value="${a}">${a}</option>`).join('');
      document.getElementById('fModel').innerHTML = '<option value="">All Models</option>'+models.map(m=>`<option value="${m}">${m}</option>`).join('');
    }catch(e){}
  }

  async function load(){
    const params = HQFilters.qs(currentFilters());
    const r = await fetch('/portal/api/audit-log/'+(params?'?'+params:''),{headers:{'Authorization':'Bearer '+token}});
    if(r.status===401){localStorage.clear();window.location.href='/portal/login/';return;}
    if(r.status===403){
      document.getElementById('logBody').innerHTML='<tr><td colspan="6" class="text-center text-danger py-4">Access restricted to HQ Administrators.</td></tr>';
      return;
    }
    const data = await r.json();
    allLogs = data.logs||[];
    render(allLogs);
  }

  function render(logs){
    const body = document.getElementById('logBody');
    if(!logs.length){
      body.innerHTML='<tr><td colspan="6" class="text-center text-muted py-4">No audit log entries found.</td></tr>';
      return;
    }
    body.innerHTML = logs.map(l=>`
      <tr>
        <td class="text-muted small">${fmtDate(l.created_at)}</td>
        <td>${l.user||'System'}</td>
        <td>${actionBadge(l.action)}</td>
        <td><code class="small">${l.model_name}</code></td>
        <td><code class="small text-truncate" style="max-width:120px;display:inline-block">${l.object_id}</code></td>
        <td class="text-muted small">${l.ip_address||'—'}</td>
      </tr>`).join('');
  }

  document.getElementById('searchInput').addEventListener('input', HQFilters.debounce(load, 350));
  document.getElementById('fAction').addEventListener('change', load);
  document.getElementById('fModel').addEventListener('change', load);
  document.getElementById('fDateFrom').addEventListener('change', load);
  document.getElementById('fDateTo').addEventListener('change', load);
  document.getElementById('fClear').addEventListener('click', ()=>{
    document.getElementById('searchInput').value='';
    document.getElementById('fAction').value='';
    document.getElementById('fModel').value='';
    document.getElementById('fDateFrom').value='';
    document.getElementById('fDateTo').value='';
    load();
  });

  document.getElementById('refreshBtn').onclick = load;
  loadFilterOptions();
  load();
})();
</script>
</body>
</html>
